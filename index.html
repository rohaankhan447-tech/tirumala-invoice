<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tirumala Washing Machine Repair Services</title>
  
  <!-- PWA Manifest & Theme Integration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e53e3e">

  <!-- html2pdf.js Library for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .invoice-card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }

    /* Header */
    .header {
      background-color: #e53e3e;
      color: #ffffff;
      padding: 16px 14px;
      text-align: center;
    }

    .header h2 {
      font-size: 16px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 11px;
      line-height: 1.3;
      opacity: 0.95;
    }

    /* Form Body */
    .form-body {
      padding: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-group label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .field-group input, 
    .field-group select {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background-color: #f8fafc;
      width: 100%;
    }

    .field-group input:focus, 
    .field-group select:focus {
      border-color: #e53e3e;
      background-color: #ffffff;
    }

    /* Products Section */
    .section-title {
      color: #e53e3e;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 10px 0;
      text-transform: uppercase;
    }

    /* Table Container for Mobile Horizontal Scroll */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
    }

    th {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      padding: 8px 4px;
      text-align: left;
    }

    td {
      padding: 6px 4px;
    }

    .item-no {
      font-weight: bold;
      color: #e53e3e;
      text-align: center;
      width: 25px;
    }

    input.table-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f8fafc;
    }

    .delete-btn {
      background-color: #fde8e8;
      color: #e53e3e;
      border: 1px solid #fbb6b6;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 auto;
    }

    /* Controls & Actions */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }

    .btn-outline {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .btn-dark {
      background-color: #1e1e2d;
      color: #ffffff;
    }

    .total-container {
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      padding: 8px 0;
      border-top: 2px dashed #e2e8f0;
      border-bottom: 2px dashed #e2e8f0;
    }

    .disclaimer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .btn-whatsapp {
      background-color: #25D366;
      color: #ffffff;
    }

    .btn-print {
      background-color: #1e293b;
      color: #ffffff;
    }

    /* Print / PDF Custom Settings */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .invoice-card {
        box-shadow: none;
        max-width: 100%;
      }
      .btn-row, .delete-btn, .action-btn, th:last-child, td:last-child {
        display: none !important;
      }
      input, select {
        border: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

<div class="invoice-card" id="invoiceArea">
  <!-- Header -->
  <div class="header">
    <h2>Tirumala Washing Machine Repair Services</h2>
    <p>Secunderabad | Raniganj | Toli Chowki | Shaikpet</p>
    <p>Mob: +91 8143226730</p>
  </div>

  <div class="form-body">
    <!-- Customer Details -->
    <div class="grid-2">
      <div class="field-group">
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="Enter Name">
      </div>
      <div class="field-group">
        <label>Date</label>
        <input type="date" id="invDate">
      </div>
    </div>

    <div class="grid-2">
      <div class="field-group">
        <label>Mobile Number</label>
        <input type="tel" id="custMobile" placeholder="Enter Mobile Number">
      </div>
      <div class="field-group">
        <label>Payment Mode</label>
        <select id="payMode">
          <option value="Cash">Cash</option>
          <option value="UPI / Online">UPI / Online</option>
          <option value="Card">Card</option>
        </select>
      </div>
    </div>

    <!-- Products / Services -->
    <div class="section-title">⚙️ Products / Services</div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 25px;">#</th>
            <th>Item Description</th>
            <th style="width: 90px;">Price (₹)</th>
            <th style="width: 40px; text-align: center;">Action</th>
          </tr>
        </thead>
        <tbody id="itemsTable">
          <tr>
            <td class="item-no">1</td>
            <td><input type="text" class="table-input item-desc" placeholder="Service Name"></td>
            <td><input type="number" class="table-input item-price" value="0" oninput="calculateTotal()"></td>
            <td>
              <button class="delete-btn" onclick="deleteRow(this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="btn-row">
      <button class="btn btn-outline" onclick="addItem()">+ Add Item</button>
      <button class="btn btn-dark" onclick="calculateTotal()">Calculate</button>
    </div>

    <div class="total-container">
      Grand Total: ₹<span id="grandTotal">0.00</span>
    </div>

    <div class="disclaimer">
      Note :- No guarantee, no warranty
    </div>

    <!-- Bottom Actions -->
    <button class="action-btn btn-whatsapp" onclick="sendWhatsApp()">
      💬 SEND BILL VIA WHATSAPP
    </button>
    <button class="action-btn btn-print" onclick="downloadPDF()">
      🖨️ PRINT / SAVE PDF
    </button>
  </div>
</div>

<script>
  // Set default date
  document.getElementById('invDate').valueAsDate = new Date();

  function calculateTotal() {
    let prices = document.querySelectorAll('.item-price');
    let total = 0;
    prices.forEach(input => {
      let val = parseFloat(input.value) || 0;
      total += val;
    });
    document.getElementById('grandTotal').innerText = total.toFixed(2);
  }

  function addItem() {
    let table = document.getElementById('itemsTable');
    let rowCount = table.rows.length + 1;
    let tr = document.createElement('tr');

    tr.innerHTML = `
      <td class="item-no">${rowCount}</td>
      <td><input type="text" class="table-input item-desc" placeholder="Service Name"></td>
      <td><input type="number" class="table-input item-price" value="0" oninput="calculateTotal()"></td>
      <td>
        <button class="delete-btn" onclick="deleteRow(this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </td>
    `;
    table.appendChild(tr);
  }

  function deleteRow(btn) {
    let row = btn.closest('tr');
    row.remove();
    updateItemNumbers();
    calculateTotal();
  }

  function updateItemNumbers() {
    let rows = document.querySelectorAll('#itemsTable tr');
    rows.forEach((row, index) => {
      row.querySelector('.item-no').innerText = index + 1;
    });
  }

  // PDF Generation Function using html2pdf.js
  function downloadPDF() {
    const element = document.getElementById('invoiceArea');
    const custName = document.getElementById('custName').value || 'Customer';
    const opt = {
      margin:       0.2,
      filename:     `Tirumala_Invoice_${custName.replace(/\s+/g, '_')}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  function sendWhatsApp() {
    let name = document.getElementById('custName').value || "Customer";
    let mobile = document.getElementById('custMobile').value;
    let payMode = document.getElementById('payMode').value;
    let date = document.getElementById('invDate').value;
    let total = document.getElementById('grandTotal').innerText;

    if (!mobile) {
      alert("Please enter Customer Mobile Number!");
      return;
    }

    let itemsList = "";
    let rows = document.querySelectorAll('#itemsTable tr');
    rows.forEach((row, index) => {
      let desc = row.querySelector('.item-desc').value || "Service";
      let price = row.querySelector('.item-price').value || "0";
      itemsList += `${index + 1}. ${desc}: ₹${price}\n`;
    });

    let message = `*TIRUMALA WASHING MACHINE REPAIR SERVICES*\n` +
      `📞 +91 8143226730\n` +
      `----------------------------------------\n` +
      `*INVOICE TO:* ${name}\n` +
      `*DATE:* ${date}\n` +
      `*PAYMENT MODE:* ${payMode}\n` +
      `----------------------------------------\n` +
      `*SERVICES:*\n${itemsList}` +
      `----------------------------------------\n` +
      `*GRAND TOTAL:* ₹${total}\n` +
      `----------------------------------------\n` +
      `_Note: No guarantee, no warranty_\n\n` +
      `Thank you for your business!`;

    let encodedMsg = encodeURIComponent(message);
    window.open(`https://wa.me/91${mobile}?text=${encodedMsg}`, '_blank');
  }

  // Service Worker Registration for PWA / PWABuilder
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').then(function(registration) {
        console.log('ServiceWorker registered successfully');
      }, function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
    });
  }
</script>

</body>
</html>
