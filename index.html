<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirumala Washing Machine Repair Services - Invoice</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .invoice-card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* Header Styling */
    .header {
      background-color: #e53e3e;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .header h2 {
      font-size: 18px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.95;
    }

    /* Form Container */
    .form-body {
      padding: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-group label {
      font-size: 11px;
      font-weight: 700;
      color: #4a5568;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field-group input, 
    .field-group select {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #f8fafc;
      transition: border-color 0.2s;
    }

    .field-group input:focus, 
    .field-group select:focus {
      border-color: #e53e3e;
      background-color: #ffffff;
    }

    /* Products Section */
    .section-title {
      color: #e53e3e;
      font-size: 13px;
      font-weight: 700;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    th {
      font-size: 11px;
      color: #718096;
      text-transform: uppercase;
      padding: 8px 6px;
      text-align: left;
    }

    td {
      padding: 6px;
    }

    .item-no {
      font-weight: bold;
      color: #e53e3e;
      text-align: center;
      width: 24px;
    }

    input.table-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f8fafc;
    }

    /* Buttons Styling */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .btn-dark {
      background-color: #1e1e2d;
      color: #ffffff;
    }

    .delete-btn {
      background-color: #fde8e8;
      color: #e53e3e;
      border: 1px solid #fbb6b6;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 auto;
    }

    .delete-btn:hover {
      background-color: #e53e3e;
      color: #ffffff;
    }

    /* Total Section */
    .total-container {
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 16px;
    }

    .disclaimer {
      text-align: center;
      font-size: 12px;
      color: #718096;
      margin-bottom: 24px;
    }

    /* Action Buttons Bottom */
    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 25px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-whatsapp {
      background-color: #48bb78;
      color: #ffffff;
    }

    .btn-print {
      background-color: #1a202c;
      color: #ffffff;
    }

    /* Print View Custom CSS */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .invoice-card {
        box-shadow: none;
        max-width: 100%;
      }
      .btn-row, .delete-btn, .action-btn, th:last-child, td:last-child {
        display: none !important;
      }
      input, select {
        border: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

<div class="invoice-card" id="invoice">
  <!-- Header -->
  <div class="header">
    <h2>Tirumala Washing Machine Repair Services</h2>
    <p>Secunderabad | Raniganj | Toli Chowki | Shaikpet (Near Passport Office)</p>
    <p>Mob: +91 8143226730 | Email: syedamerbinsohail@gmail.com</p>
  </div>

  <div class="form-body">
    <!-- Customer Info -->
    <div class="grid-2">
      <div class="field-group">
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="Enter Customer Name">
      </div>
      <div class="field-group">
        <label>Date</label>
        <input type="date" id="invDate">
      </div>
    </div>

    <div class="grid-2">
      <div class="field-group">
        <label>Mobile Number</label>
        <input type="tel" id="custMobile" placeholder="Mobile Number">
      </div>
      <div class="field-group">
        <label>Payment Mode</label>
        <select id="payMode">
          <option value="Cash">Cash</option>
          <option value="UPI / Online">UPI / Online</option>
          <option value="Card">Card</option>
        </select>
      </div>
    </div>

    <!-- Products / Services -->
    <div class="section-title">
      ⚙️ Products / Services
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 30px;">#</th>
          <th>Item Description</th>
          <th style="width: 100px;">Price (₹)</th>
          <th style="width: 50px; text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody id="itemsTable">
        <tr>
          <td class="item-no">1</td>
          <td><input type="text" class="table-input item-desc" placeholder="Item Name / Service"></td>
          <td><input type="number" class="table-input item-price" value="0" oninput="calculateTotal()"></td>
          <td>
            <button class="delete-btn" onclick="deleteRow(this)" title="Delete Item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="btn-row">
      <button class="btn btn-outline" onclick="addItem()">+ Add Item</button>
      <button class="btn btn-dark" onclick="calculateTotal()">🧮 Calculate Total</button>
    </div>

    <div class="total-container">
      Grand Total: ₹<span id="grandTotal">0.00</span>
    </div>

    <div class="disclaimer">
      Note :- No guarantee, no warranty
    </div>

    <!-- Actions -->
    <button class="action-btn btn-whatsapp" onclick="sendWhatsApp()">
      💬 SEND BILL VIA WHATSAPP
    </button>
    <button class="action-btn btn-print" onclick="window.print()">
      🖨️ PRINT / SAVE PDF INVOICE
    </button>
  </div>
</div>

<script>
  // Set Today's Date by Default
  document.getElementById('invDate').valueAsDate = new Date();

  // Calculate Total Amount
  function calculateTotal() {
    let prices = document.querySelectorAll('.item-price');
    let total = 0;
    prices.forEach(input => {
      let val = parseFloat(input.value) || 0;
      total += val;
    });
    document.getElementById('grandTotal').innerText = total.toFixed(2);
  }

  // Add New Item Row
  function addItem() {
    let table = document.getElementById('itemsTable');
    let rowCount = table.rows.length + 1;
    let tr = document.createElement('tr');

    tr.innerHTML = `
      <td class="item-no">${rowCount}</td>
      <td><input type="text" class="table-input item-desc" placeholder="Item Name / Service"></td>
      <td><input type="number" class="table-input item-price" value="0" oninput="calculateTotal()"></td>
      <td>
        <button class="delete-btn" onclick="deleteRow(this)" title="Delete Item">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </td>
    `;
    table.appendChild(tr);
  }

  // Delete Row Function
  function deleteRow(btn) {
    let row = btn.closest('tr');
    row.remove();
    updateItemNumbers();
    calculateTotal();
  }

  // Update Row Numbers after Delete
  function updateItemNumbers() {
    let rows = document.querySelectorAll('#itemsTable tr');
    rows.forEach((row, index) => {
      row.querySelector('.item-no').innerText = index + 1;
    });
  }

  // Send Bill on WhatsApp
  function sendWhatsApp() {
    let name = document.getElementById('custName').value || "Customer";
    let mobile = document.getElementById('custMobile').value;
    let total = document.getElementById('grandTotal').innerText;

    if (!mobile) {
      alert("Please enter Customer Mobile Number!");
      return;
    }

    let message = `Hello ${name},\nThank you for choosing Tirumala Washing Machine Repair Services.\n\nYour Total Bill Amount is ₹${total}.\nHave a great day!`;
    let encodedMsg = encodeURIComponent(message);
    window.open(`https://wa.me/91${mobile}?text=${encodedMsg}`, '_blank');
  }

</body>
</html>
